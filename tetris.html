<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>테트리스 (Single File)</title>
  <style>
    :root{
      --bg1:#0f1720;
      --bg2:#071021;
      --panel:#0b1220;
      --accent:#ffd166;
      --muted:#9aa6b2;
      --green:#06d6a0;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family: "Segoe UI", Roboto, "Noto Sans KR", sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#e6eef6}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .game{display:flex;gap:18px;align-items:flex-start}
    canvas#board{background:#000;border-radius:6px;display:block;image-rendering:pixelated;box-shadow:0 6px 24px rgba(0,0,0,.6)}
    .panel{width:220px;padding:16px;border-radius:8px;background:linear-gradient(180deg,var(--panel),#071022);box-shadow:inset 0 1px 0 rgba(255,255,255,0.02)}
    .panel h2{margin:0 0 8px 0;font-size:16px;color:var(--accent)}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .stat{background:rgba(255,255,255,0.03);padding:8px;border-radius:6px;font-size:14px}
    .controls{font-size:13px;color:var(--muted);line-height:1.6}
    .buttons{display:flex;gap:8px;margin-top:12px}
    button{flex:1;padding:8px;border-radius:6px;border:0;background:#17324d;color:#fff;cursor:pointer}
    button.secondary{background:#334e64}
    .next-canvas{background:#061018;border-radius:6px;display:block;margin:8px 0}
    .footer{font-size:12px;color:var(--muted);margin-top:10px}
    @media(max-width:720px){.game{flex-direction:column;align-items:center}.panel{width:100%}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="game" role="application" aria-label="테트리스 게임">
      <canvas id="board" width="300" height="600" aria-label="게임 보드"></canvas>
      <div class="panel" aria-hidden="false">
        <h2>TETRIS</h2>
        <div>
          <canvas id="next" class="next-canvas" width="120" height="120"></canvas>
        </div>
        <div class="stats">
          <div class="stat">점수<br><strong id="score">0</strong></div>
          <div class="stat">레벨<br><strong id="level">1</strong></div>
          <div class="stat">라인<br><strong id="lines">0</strong></div>
          <div class="stat">속도<br><strong id="speed">1.0x</strong></div>
        </div>
        <div class="controls">
          <div><strong>조작</strong></div>
          <div>← → : 좌/우 이동</div>
          <div>↑ : 회전</div>
          <div>↓ : 소프트 드롭</div>
          <div>Space : 하드 드롭</div>
        </div>
        <div class="buttons">
          <button id="start">시작</button>
          <button id="pause" class="secondary">일시정지</button>
        </div>
        <div class="footer">브라우저에서 열면 플레이 가능합니다.</div>
      </div>
    </div>
  </div>

  <script>
    // 기본 설정
    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 30; // px
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // 다음 블록 캔버스
    const nextCanvas = document.getElementById('next');
    const nctx = nextCanvas.getContext('2d');
    nctx.imageSmoothingEnabled = false;

    // UI 요소
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const linesEl = document.getElementById('lines');
    const speedEl = document.getElementById('speed');
    const startBtn = document.getElementById('start');
    const pauseBtn = document.getElementById('pause');

    // 색상 (인덱스 0은 빈칸)
    const COLORS = [
      '#000000',
      '#FF6B6B', // T
      '#F7B267', // O
      '#7DCE82', // L
      '#4D96FF', // J
      '#C77DFF', // S
      '#22C1C3', // Z
      '#FFD166'  // I
    ];

    // 게임 상태
    let arena = createMatrix(COLS, ROWS);
    let score = 0;
    let level = 1;
    let lines = 0;
    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    let isPaused = false;
    let isStarted = false;

    // 플레이어 (현재 블록)
    const player = {
      pos: {x:0, y:0},
      matrix: null,
      next: null
    };

    // 7-배그(랜덤 백) 구현
    function createBag(){
      const types = ['I','J','L','O','S','T','Z'];
      for (let i = types.length -1; i > 0; i--){
        const j = Math.floor(Math.random()*(i+1));
        [types[i], types[j]] = [types[j], types[i]];
      }
      return types;
    }
    let bag = createBag();

    // 행렬 생성
    function createMatrix(w, h){
      const m = [];
      while(h--) m.push(new Array(w).fill(0));
      return m;
    }

    // 도형 생성 (숫자 인덱스 사용)
    function createPiece(type){
      switch(type){
        case 'T': return [
          [0,1,0],
          [1,1,1],
          [0,0,0]
        ];
        case 'O': return [
          [2,2],
          [2,2]
        ];
        case 'L': return [
          [0,0,3],
          [3,3,3],
          [0,0,0]
        ];
        case 'J': return [
          [4,0,0],
          [4,4,4],
          [0,0,0]
        ];
        case 'S': return [
          [0,5,5],
          [5,5,0],
          [0,0,0]
        ];
        case 'Z': return [
          [6,6,0],
          [0,6,6],
          [0,0,0]
        ];
        case 'I': return [
          [0,0,0,0],
          [7,7,7,7],
          [0,0,0,0],
          [0,0,0,0]
        ];
      }
    }

    // 도형의 값을 해당 색상 인덱스로 변환
    function pieceValueFromType(type){
      switch(type){
        case 'T': return 1;
        case 'O': return 2;
        case 'L': return 3;
        case 'J': return 4;
        case 'S': return 5;
        case 'Z': return 6;
        case 'I': return 7;
      }
    }

    // 그리기
    function draw(){
      ctx.fillStyle = '#000';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      drawMatrix(arena, {x:0, y:0});
      if (player.matrix) {
        drawMatrix(player.matrix, player.pos);
      }
    }

    function drawMatrix(matrix, offset){
      for (let y=0; y < matrix.length; y++){
        for (let x=0; x < matrix[y].length; x++){
          const val = matrix[y][x];
          if (val !== 0){
            ctx.fillStyle = COLORS[val];
            ctx.fillRect((x + offset.x) * BLOCK, (y + offset.y) * BLOCK, BLOCK-1, BLOCK-1);
          }
        }
      }
    }

    // 다음 블록 표시
    function drawNext(){
      nctx.fillStyle = '#000';
      nctx.fillRect(0,0,nextCanvas.width,nextCanvas.height);
      const m = player.next;
      if (!m) return;
      const cell = Math.floor(nextCanvas.width / 4); // 고정 스케일
      const offsetX = Math.floor((nextCanvas.width - m[0].length*cell)/2);
      const offsetY = Math.floor((nextCanvas.height - m.length*cell)/2);
      for (let y=0;y<m.length;y++){
        for (let x=0;x<m[y].length;x++){
          const v = m[y][x];
          if(v){
            nctx.fillStyle = COLORS[v];
            nctx.fillRect(offsetX + x*cell + 2, offsetY + y*cell + 2, cell-4, cell-4);
          }
        }
      }
    }

    // 충돌 검사
    function collide(arena, player){
      const m = player.matrix;
      const o = player.pos;
      for (let y=0;y<m.length;y++){
        for (let x=0;x<m[y].length;x++){
          if (m[y][x] !== 0){
            if (arena[y + o.y] && arena[y + o.y][x + o.x] !== 0){
              return true;
            }
            if (arena[y + o.y] === undefined || arena[y + o.y][x + o.x] === undefined){
              return true;
            }
          }
        }
      }
      return false;
    }

    // 병합
    function merge(arena, player){
      player.matrix.forEach((row, y) => {
        row.forEach((val, x) => {
          if (val !== 0){
            arena[y + player.pos.y][x + player.pos.x] = val;
          }
        });
      });
    }

    // 행 제거 및 점수 계산
    function arenaSweep(){
      let rowCount = 0;
      outer: for (let y = arena.length -1; y >= 0; y--){
        for (let x=0;x<arena[y].length;x++){
          if (arena[y][x] === 0){
            continue outer;
          }
        }
        const row = arena.splice(y,1)[0].fill(0);
        arena.unshift(row);
        y++;
        rowCount++;
      }
      if (rowCount > 0){
        const scores = [0, 40, 100, 300, 1200];
        score += scores[rowCount] * level;
        lines += rowCount;
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(100, 1000 * Math.pow(0.9, level - 1));
        speedEl.textContent = (1000 / dropInterval).toFixed(2) + 'x';
        scoreEl.textContent = score;
        levelEl.textContent = level;
        linesEl.textContent = lines;
      }
    }

    // 회전 (행렬 회전)
    function rotate(matrix, dir){
      for (let y=0;y<matrix.length;y++){
        for (let x=0;x<y;x++){
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0){
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    function playerRotate(dir){
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)){
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (Math.abs(offset) > player.matrix[0].length){
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    // 블록 생성 (다음에서 꺼냄)
    function spawn(){
      if (bag.length === 0) bag = createBag();
      const type = bag.pop();
      const value = pieceValueFromType(type);
      const base = createPiece(type);
      const matrix = base.map(row => row.map(cell => cell ? value : 0));
      player.matrix = matrix;
      player.pos.y = 0;
      player.pos.x = Math.floor(COLS / 2) - Math.floor(matrix[0].length / 2);
      // next 준비
      if (bag.length === 0) bag = createBag();
      const nextType = bag[bag.length - 1];
      const nextValue = pieceValueFromType(nextType);
      player.next = createPiece(nextType).map(r => r.map(c => c ? nextValue : 0));

      if (collide(arena, player)){
        // 게임 오버
        arena.forEach(row => row.fill(0));
        score = 0;
        level = 1;
        lines = 0;
        scoreEl.textContent = score;
        levelEl.textContent = level;
        linesEl.textContent = lines;
        isStarted = false;
        isPaused = true;
        alert('게임 오버! 다시 시작하세요.');
      }
      drawNext();
    }

    function playerDrop(){
      player.pos.y++;
      if (collide(arena, player)){
        player.pos.y--;
        merge(arena, player);
        arenaSweep();
        spawn();
      }
      dropCounter = 0;
    }

    function playerMove(dir){
      player.pos.x += dir;
      if (collide(arena, player)){
        player.pos.x -= dir;
      }
    }

    // 하드 드롭
    function hardDrop(){
      while(!collide(arena, player)){
        player.pos.y++;
      }
      player.pos.y--;
      merge(arena, player);
      arenaSweep();
      spawn();
      dropCounter = 0;
    }

    // 타이머 루프
    function update(time = 0){
      if (!isStarted) return;
      const deltaTime = time - lastTime;
      lastTime = time;
      if (!isPaused){
        dropCounter += deltaTime;
        if (dropCounter > dropInterval){
          playerDrop();
        }
        draw();
      }
      requestAnimationFrame(update);
    }

    // 입력 처리
    document.addEventListener('keydown', event => {
      if (!isStarted) return;
      if (event.key === 'ArrowLeft'){
        playerMove(-1);
      } else if (event.key === 'ArrowRight'){
        playerMove(1);
      } else if (event.key === 'ArrowDown'){
        playerDrop();
        score += 1;
        scoreEl.textContent = score;
      } else if (event.key === 'ArrowUp'){
        playerRotate(1);
      } else if (event.code === 'Space'){
        event.preventDefault();
        hardDrop();
      } else if (event.key === 'p' || event.key === 'P'){
        togglePause();
      }
      draw();
    });

    // 버튼 이벤트
    startBtn.addEventListener('click', ()=> {
      start();
    });
    pauseBtn.addEventListener('click', ()=> {
      togglePause();
    });

    function togglePause(){
      if (!isStarted) return;
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? '재개' : '일시정지';
      if (!isPaused){
        lastTime = performance.now();
      }
    }

    function start(){
      arena = createMatrix(COLS, ROWS);
      score = 0;
      lines = 0;
      level = 1;
      dropInterval = 1000;
      bag = createBag();
      player.next = null;
      spawn();
      scoreEl.textContent = score;
      levelEl.textContent = level;
      linesEl.textContent = lines;
      speedEl.textContent = (1000 / dropInterval).toFixed(2) + 'x';
      isPaused = false;
      isStarted = true;
      lastTime = performance.now();
      requestAnimationFrame(update);
    }

    // 초기 화면
    draw();
    drawNext();

    // 모바일/터치 간단 버튼 (선택): 화면 터치시 좌/우/회전 처리
    canvas.addEventListener('touchstart', e => {
      if (!isStarted) start();
      const rect = canvas.getBoundingClientRect();
      const x = e.touches[0].clientX - rect.left;
      if (x < rect.width/3){
        playerMove(-1);
      } else if (x > rect.width*2/3){
        playerMove(1);
      } else {
        playerRotate(1);
      }
    }, {passive:true});
  </script>
</body>

      nctx.fillRect(0,0,nextCanvas.width,nextCanvas.height);
      const m = player.next;
      if (!m) return;
      const cell = Math.floor(nextCanvas.width / 4); // 고정 스케일
      const offsetX = Math.floor((nextCanvas.width - m[0].length*cell)/2);
      const offsetY = Math.floor((nextCanvas.height - m.length*cell)/2);
      for (let y=0;y<m.length;y++){
        for (let x=0;x<m[y].length;x++){
          const v = m[y][x];
          if(v){
            nctx.fillStyle = COLORS[v];
            nctx.fillRect(offsetX + x*cell + 2, offsetY + y*cell + 2, cell-4, cell-4);
          }
        }
      }
    }

    // 충돌 검사
    function collide(arena, player){
      const m = player.matrix;
      const o = player.pos;
      for (let y=0;y<m.length;y++){
        for (let x=0;x<m[y].length;x++){
          if (m[y][x] !== 0){
            if (arena[y + o.y] && arena[y + o.y][x + o.x] !== 0){
              return true;
            }
            if (arena[y + o.y] === undefined || arena[y + o.y][x + o.x] === undefined){
              return true;
            }
          }
        }
      }
      return false;
    }

    // 병합
    function merge(arena, player){
      player.matrix.forEach((row, y) => {
        row.forEach((val, x) => {
          if (val !== 0){
            arena[y + player.pos.y][x + player.pos.x] = val;
          }
        });
      });
    }

    // 행 제거 및 점수 계산
    function arenaSweep(){
      let rowCount = 0;
      outer: for (let y = arena.length -1; y >= 0; y--){
        for (let x=0;x<arena[y].length;x++){
          if (arena[y][x] === 0){
            continue outer;
          }
        }
        const row = arena.splice(y,1)[0].fill(0);
        arena.unshift(row);
        y++;
        rowCount++;
      }
      if (rowCount > 0){
        const scores = [0, 40, 100, 300, 1200];
        score += scores[rowCount] * level;
        lines += rowCount;
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(100, 1000 * Math.pow(0.9, level - 1));
        speedEl.textContent = (1000 / dropInterval).toFixed(2) + 'x';
        scoreEl.textContent = score;
        levelEl.textContent = level;
        linesEl.textContent = lines;
      }
    }

    // 회전 (행렬 회전)
    function rotate(matrix, dir){
      for (let y=0;y<matrix.length;y++){
        for (let x=0;x<y;x++){
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0){
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    function playerRotate(dir){
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)){
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (Math.abs(offset) > player.matrix[0].length){
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    // 블록 생성 (다음에서 꺼냄)
    function spawn(){
      if (bag.length === 0) bag = createBag();
      const type = bag.pop();
      const value = pieceValueFromType(type);
      const base = createPiece(type);
      const matrix = base.map(row => row.map(cell => cell ? value : 0));
      player.matrix = matrix;
      player.pos.y = 0;
      player.pos.x = Math.floor(COLS / 2) - Math.floor(matrix[0].length / 2);
      // next 준비
      if (bag.length === 0) bag = createBag();
      const nextType = bag[bag.length - 1];
      const nextValue = pieceValueFromType(nextType);
      player.next = createPiece(nextType).map(r => r.map(c => c ? nextValue : 0));

      if (collide(arena, player)){
        // 게임 오버
        arena.forEach(row => row.fill(0));
        score = 0;
        level = 1;
        lines = 0;
        scoreEl.textContent = score;
        levelEl.textContent = level;
        linesEl.textContent = lines;
        isStarted = false;
        isPaused = true;
        alert('게임 오버! 다시 시작하세요.');
      }
      drawNext();
    }

    function playerDrop(){
      player.pos.y++;
      if (collide(arena, player)){
        player.pos.y--;
        merge(arena, player);
        arenaSweep();
        spawn();
      }
      dropCounter = 0;
    }

    function playerMove(dir){
      player.pos.x += dir;
      if (collide(arena, player)){
        player.pos.x -= dir;
      }
    }

    // 하드 드롭
    function hardDrop(){
      while(!collide(arena, player)){
        player.pos.y++;
      }
      player.pos.y--;
      merge(arena, player);
      arenaSweep();
      spawn();
      dropCounter = 0;
    }

    // 타이머 루프
    function update(time = 0){
      if (!isStarted) return;
      const deltaTime = time - lastTime;
      lastTime = time;
      if (!isPaused){
        dropCounter += deltaTime;
        if (dropCounter > dropInterval){
          playerDrop();
        }
        draw();
      }
      requestAnimationFrame(update);
    }

    // 입력 처리
    document.addEventListener('keydown', event => {
      if (!isStarted) return;
      if (event.key === 'ArrowLeft'){
        playerMove(-1);
      } else if (event.key === 'ArrowRight'){
        playerMove(1);
      } else if (event.key === 'ArrowDown'){
        playerDrop();
        score += 1;
        scoreEl.textContent = score;
      } else if (event.key === 'ArrowUp'){
        playerRotate(1);
      } else if (event.code === 'Space'){
        event.preventDefault();
        hardDrop();
      } else if (event.key === 'p' || event.key === 'P'){
        togglePause();
      }
      draw();
    });

    // 버튼 이벤트
    startBtn.addEventListener('click', ()=> {
      start();
    });
    pauseBtn.addEventListener('click', ()=> {
      togglePause();
    });

    function togglePause(){
      if (!isStarted) return;
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? '재개' : '일시정지';
      if (!isPaused){
        lastTime = performance.now();
      }
    }

    function start(){
      arena = createMatrix(COLS, ROWS);
      score = 0;
      lines = 0;
      level = 1;
      dropInterval = 1000;
      bag = createBag();
      player.next = null;
      spawn();
      scoreEl.textContent = score;
      levelEl.textContent = level;
      linesEl.textContent = lines;
      speedEl.textContent = (1000 / dropInterval).toFixed(2) + 'x';
      isPaused = false;
      isStarted = true;
      lastTime = performance.now();
      requestAnimationFrame(update);
    }

    // 초기 화면
    draw();
    drawNext();

    // 모바일/터치 간단 버튼 (선택): 화면 터치시 좌/우/회전 처리
    canvas.addEventListener('touchstart', e => {
      if (!isStarted) start();
      const rect = canvas.getBoundingClientRect();
      const x = e.touches[0].clientX - rect.left;
      if (x < rect.width/3){
        playerMove(-1);
      } else if (x > rect.width*2/3){
        playerMove(1);
      } else {
        playerRotate(1);
      }
    }, {passive:true});
  </script>
</body>
</html>
